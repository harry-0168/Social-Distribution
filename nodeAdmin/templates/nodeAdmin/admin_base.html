{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'admin.css' %}">
    <title>Node Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
   
</head>

<body>

    <div class="sidebar">
        <!-- User Profile Image Section -->
        <div class="user-image">
            <img src="{% static 'avatar.png' %}">
        </div>

        <!-- Navigation Links -->
        <nav>
            <a href="{% url 'manage_dashboard' %}">
                <img src="/static/dashboard.png" alt="Dashboard">
                Dashboard
            </a>
            <a href="{% url 'manage_notifications' %}">
                <img src="/static/notifications.png" alt="Notification Icon">
                Notification
            </a>
            <hr>
            <a href="{% url 'manage_authors' %}">
                <img src="/static/authors.png" alt="Manage Authors Icon">
                Manage Authors
            </a>
            <a href="{% url 'manage_posts' %}">
                <img src="/static/posts.png" alt="Manage Posts Icon">
                Manage Posts
            </a>
            <a href="{% url 'manage_nodes' %}">
                <img src="/static/nodes.png" alt="Manage Nodes Icon">
                Manage Nodes
            </a>
            <hr>
            <a href="{% url 'manage_settings' %}">
                <img src="/static/settings.png" alt="Settings Icon">
                Settings
            </a>
        </nav>

        <!-- Logout Section -->
        <div class="logout">
            <a href="#">
                <img src="/static/logout.png" alt="Logout Icon">
                Logout
            </a>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Block for content to be overridden in child templates -->
        {% block content %}
        {% endblock content %}
    </div>

</body>
</html>
